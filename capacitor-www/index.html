<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesari</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6f5f2; color: #1f1d1a; }
      @media (prefers-color-scheme: dark) { body { background: #161513; color: #f1efe9; } }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      button { margin-top: 1rem; padding: 0.75rem 1.25rem; border: 0; border-radius: 0.5rem; background: #1f6f5c; color: #fff; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>O Mesari precisa de internet para abrir. Verifique o Wi-Fi e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
