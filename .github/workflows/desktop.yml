name: Aplicativo desktop Windows

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4.2.2
      - name: Configurar Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Instalar dependências do site
        run: npm ci
      - name: Instalar dependências do desktop
        run: npm ci
        working-directory: desktop
      - name: Baixar o Electron
        run: node node_modules/electron/install.js
        working-directory: desktop
      - name: Gerar instalador
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        run: npm run desktop:build
      - name: Criar a release antes do upload
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Mesari ${GITHUB_REF_NAME#desktop-v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gerar e publicar no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: npm run desktop:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enviar instalador como artefato
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Mesari-Setup-Windows-x64
          path: desktop/release/*.exe
          if-no-files-found: error
